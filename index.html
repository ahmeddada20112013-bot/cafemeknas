<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مقهى مكناس — الطلبات والألعاب</title>
  <meta name="theme-color" content="#1f2937">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">☕🎮</span>
      <span id="cafeName">مقهى مكناس</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="cafe">☕ المقهى</button>
      <button class="tab" data-view="games">🎮 صالة الألعاب</button>
      <button class="tab" data-view="menu">قائمة المنتجات</button>
      <button class="tab" data-view="reports">التقارير</button>
      <button class="tab" data-view="settings">الإعدادات</button>
    </nav>
    <div class="clock" id="clock"></div>
  </header>

  <main>
    <!-- الطاولات والألعاب -->
    <section id="view-floor" class="view active">
      <h1 class="section-title" id="floorTitle"></h1>
      <div class="toolbar">
        <div class="filters" id="floorFilters">
          <button class="chip active" data-filter="all">الكل</button>
          <button class="chip" data-filter="busy">المشغولة</button>
          <button class="chip" data-filter="free">المتاحة</button>
        </div>
        <div class="summary" id="floorSummary"></div>
      </div>
      <div class="grid stations" id="stationsGrid"></div>
    </section>

    <!-- قائمة المنتجات -->
    <section id="view-menu" class="view">
      <div class="panel">
        <h2>إضافة / تعديل منتج</h2>
        <form id="productForm" class="form-row">
          <input type="hidden" id="productId">
          <label>الاسم <input id="productName" required></label>
          <label>الصنف <input id="productCategory" list="categoryList" required placeholder="مشروبات ساخنة"></label>
          <datalist id="categoryList"></datalist>
          <label>السعر <input id="productPrice" type="number" step="0.5" min="0" required></label>
          <div class="form-actions">
            <button type="submit" class="btn primary">حفظ</button>
            <button type="button" class="btn" id="productCancel">إلغاء</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h2>المنتجات</h2>
          <input id="productSearch" placeholder="بحث..." class="search">
        </div>
        <div id="productsTable"></div>
      </div>
    </section>

    <!-- التقارير -->
    <section id="view-reports" class="view">
      <div class="panel">
        <div class="panel-head">
          <h2>تقرير المبيعات</h2>
          <div class="form-row compact">
            <label>من <input type="date" id="reportFrom"></label>
            <label>إلى <input type="date" id="reportTo"></label>
            <label>القسم
              <select id="reportSection">
                <option value="all">الكل</option>
                <option value="table">المقهى</option>
                <option value="game">صالة الألعاب</option>
              </select>
            </label>
            <button class="btn" id="reportToday">اليوم</button>
            <button class="btn" id="reportPrint">طباعة</button>
            <button class="btn" id="reportCsv">تصدير CSV</button>
          </div>
        </div>
        <div class="stats" id="reportStats"></div>
      </div>
      <div class="two-col">
        <div class="panel">
          <h2>الأكثر مبيعاً</h2>
          <div id="reportTop"></div>
        </div>
        <div class="panel">
          <h2>المداخيل حسب الطاولة / المحطة</h2>
          <div id="reportGames"></div>
        </div>
      </div>
      <div class="panel">
        <h2>الفواتير</h2>
        <div id="reportSales"></div>
      </div>
    </section>

    <!-- الإعدادات -->
    <section id="view-settings" class="view">
      <div class="panel">
        <h2>معلومات المقهى</h2>
        <form id="settingsForm" class="form-row">
          <label>اسم المقهى <input id="setName" required></label>
          <label>العملة <input id="setCurrency" required></label>
          <label>تقريب وقت اللعب (دقائق) <input id="setRound" type="number" min="1" required></label>
          <label>الحد الأدنى للعب (دقائق) <input id="setMin" type="number" min="0" required></label>
          <label class="wide">نص أسفل الفاتورة <input id="setFooter"></label>
          <div class="form-actions"><button class="btn primary" type="submit">حفظ الإعدادات</button></div>
        </form>
      </div>

      <div class="panel">
        <h2>الطاولات ومحطات الألعاب</h2>
        <form id="stationForm" class="form-row">
          <input type="hidden" id="stationId">
          <label>الاسم <input id="stationName" required placeholder="بلايستيشن 1"></label>
          <label>النوع
            <select id="stationType">
              <option value="table">طاولة مقهى</option>
              <option value="game">محطة ألعاب</option>
            </select>
          </label>
          <label class="game-only">طريقة الاحتساب
            <select id="stationBilling">
              <option value="hour">بالساعة</option>
              <option value="match">بالمباراة / الجولة</option>
            </select>
          </label>
          <label class="game-only">السعر <input id="stationRate" type="number" step="0.5" min="0" value="0"></label>
          <label class="game-only">الأيقونة
            <select id="stationIcon">
              <option>🎮</option><option>🎱</option><option>⚽</option><option>🏓</option><option>🕹️</option><option>🃏</option><option>🥽</option>
            </select>
          </label>
          <div class="form-actions">
            <button class="btn primary" type="submit">حفظ</button>
            <button class="btn" type="button" id="stationCancel">إلغاء</button>
          </div>
        </form>
        <div id="stationsTable"></div>
      </div>

      <div class="panel">
        <h2>النسخ الاحتياطي</h2>
        <p class="muted">كل البيانات محفوظة في هذا المتصفح. صدّر نسخة احتياطية بانتظام.</p>
        <div class="form-row compact">
          <button class="btn" id="backupExport">تصدير نسخة احتياطية</button>
          <label class="btn file-btn">استيراد نسخة<input type="file" id="backupImport" accept="application/json" hidden></label>
          <button class="btn danger" id="clearSales">حذف سجل المبيعات</button>
        </div>
      </div>
    </section>
  </main>

  <!-- نافذة الطلب -->
  <dialog id="orderDialog">
    <div class="order-wrap">
      <div class="order-menu">
        <div class="order-head">
          <h2 id="orderTitle"></h2>
          <input id="orderSearch" class="search" placeholder="بحث عن منتج...">
        </div>
        <div class="filters" id="orderCategories"></div>
        <div class="grid products" id="orderProducts"></div>
      </div>
      <aside class="order-side">
        <div id="gameBox" class="game-box"></div>
        <h3>الطلب</h3>
        <div id="orderItems" class="order-items"></div>
        <div class="order-totals" id="orderTotals"></div>
        <div class="form-row compact">
          <label>تخفيض <input id="orderDiscount" type="number" min="0" step="0.5" value="0"></label>
          <label>الدفع
            <select id="orderPayment">
              <option value="cash">نقداً</option>
              <option value="card">بطاقة</option>
            </select>
          </label>
        </div>
        <div class="order-actions">
          <button class="btn" id="orderPrintBtn">طباعة مؤقتة</button>
          <button class="btn" id="orderMoveBtn">نقل الطلب</button>
          <button class="btn danger" id="orderCancelBtn">إلغاء الطلب</button>
          <button class="btn primary big" id="orderCheckoutBtn">إنهاء ودفع</button>
          <button class="btn" id="orderCloseBtn">إغلاق</button>
        </div>
      </aside>
    </div>
  </dialog>

  <dialog id="moveDialog" class="small">
    <h3>نقل الطلب إلى</h3>
    <select id="moveTarget"></select>
    <div class="order-actions">
      <button class="btn primary" id="moveConfirm">نقل</button>
      <button class="btn" id="moveCancel">إلغاء</button>
    </div>
  </dialog>

  <div id="printArea"></div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
